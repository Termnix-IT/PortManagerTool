name: Release

# v1.2.3 形式のタグを push すると、インストーラーと単体の実行ファイルをビルドして
# GitHub Releases に「下書き」としてアップロードする。
# 利用者（自動アップデート）に届くのは、Releases 画面で下書きを公開したとき。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # アプリのバージョンは package.json（tauri.conf.json が参照する）。Cargo.toml も揃える
      - name: Verify tag matches package.json and Cargo.toml versions
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          cargo_version="$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ] || [ "${cargo_version}" != "${version}" ]; then
            echo "タグ ${GITHUB_REF_NAME}、package.json (${version})、Cargo.toml (${cargo_version}) のバージョンが一致しません"
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      # 自動アップデート用の署名（.sig）も作る。秘密鍵は Secrets から渡す（docs/RELEASE.md）
      - name: Build
        shell: bash
        run: npx tauri build --ci --config '{"bundle":{"createUpdaterArtifacts":true}}'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # 配布物の名前を v1.0.0（Electron 版）と揃え、アップデート情報 latest.json を作る
      - name: Collect release files
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          setup="$(ls src-tauri/target/release/bundle/nsis/*-setup.exe)"
          cp "${setup}" "release/PortManagerTool-Setup-${version}.exe"
          cp "${setup}.sig" "release/PortManagerTool-Setup-${version}.exe.sig"
          cp src-tauri/target/release/port-manager-tool.exe "release/PortManagerTool-Portable-${version}.exe"
          VERSION="${version}" node -e "
            const fs = require('fs');
            const version = process.env.VERSION;
            const name = 'PortManagerTool-Setup-' + version + '.exe';
            const latest = {
              version,
              notes: '',
              pub_date: new Date().toISOString(),
              platforms: {
                'windows-x86_64': {
                  signature: fs.readFileSync('release/' + name + '.sig', 'utf8').trim(),
                  url: 'https://github.com/' + process.env.GITHUB_REPOSITORY + '/releases/download/v' + version + '/' + name,
                },
              },
            };
            fs.writeFileSync('release/latest.json', JSON.stringify(latest, null, 2) + '\n');
          "
          ls -l release

      - name: Upload to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "リリース ${GITHUB_REF_NAME} は既に存在します。ファイルを上書きします"
          else
            gh release create "${GITHUB_REF_NAME}" --draft --title "${version}" --notes "" --verify-tag
          fi
          gh release upload "${GITHUB_REF_NAME}" release/* --clobber
