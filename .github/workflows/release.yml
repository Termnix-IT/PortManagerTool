name: Release

# v1.2.3 形式のタグを push すると、インストーラーとポータブル版をビルドして
# GitHub Releases に「下書き」としてアップロードする。
# 利用者（自動アップデート）に届くのは、Releases 画面で下書きを公開したとき。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "タグ ${GITHUB_REF_NAME} と package.json の version (${version}) が一致しません"
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm test

      # electron-builder はインストーラーとポータブル版のアップロードを並行に行い、
      # 下書きが無いとそれぞれが作成してしまう（v1.0.0 で下書きが2つに分かれた）。
      # 先に1つ作っておき、両方がそこへアップロードするようにする
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "リリース ${GITHUB_REF_NAME} は既に存在します"
          else
            gh release create "${GITHUB_REF_NAME}" --draft --title "${version}" --notes "" --verify-tag
          fi

      - name: Build and publish (draft)
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # コード署名（任意）。Secrets に登録されていれば electron-builder が署名する。
          # 未登録の場合は空文字になり、署名なしでビルドされる。手順は docs/RELEASE.md を参照。
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
