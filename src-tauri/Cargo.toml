[package]
name = "port-manager-tool"
# アプリのバージョンは package.json が正（tauri.conf.json が参照する）。リリース時はここも揃える
version = "1.0.0"
description = "Port management tool for Windows"
authors = ["Termnix-IT"]
license = "ISC"
repository = "https://github.com/Termnix-IT/PortManagerTool"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "port_manager_tool_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tauri-winrt-notification = "0.8"

[dependencies.windows]
version = "0.62"
features = [
  "Wdk_System_Threading",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
